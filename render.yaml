services:
  - type: web
    name: qa-tracker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /ready
    autoDeployTrigger: "off"
    disk:
      name: qa-tracker-storage
      mountPath: /opt/render/project/src/qa-platform/storage
      sizeGB: 1
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: QA_ENVIRONMENT
        value: "production"
      - key: DATABASE_URL
        sync: false
      - key: QA_CORS_ORIGINS
        sync: false
      - key: QA_ADMIN_PASSWORD
        sync: false
      - key: QA_TRIAL_DURATION_DAYS
        value: "14"
      - key: QA_AI_ENCRYPTION_KEY
        generateValue: true
      - key: QA_ALLOW_PUBLIC_AUTH
        value: "true"
      - key: QA_COOKIE_SECURE
        value: "true"
  - type: cron
    name: qa-tracker-trial-expiry
    runtime: python
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/expire_trials.py
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: QA_TRIAL_DURATION_DAYS
        value: "14"
