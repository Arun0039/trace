<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141713" />
      <stop offset="100%" stop-color="#0a0c0a" />
    </linearGradient>

    <!-- Top Horizontal Bar Gradient -->
    <linearGradient id="topBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b0f83e" />
      <stop offset="100%" stop-color="#93e921" />
    </linearGradient>

    <!-- Stem Left Facet (Light Green) -->
    <linearGradient id="stemLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ded29" />
      <stop offset="100%" stop-color="#73cb18" />
    </linearGradient>

    <!-- Stem Right Facet (Darker Shaded Green) -->
    <linearGradient id="stemRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72ca17" />
      <stop offset="100%" stop-color="#4d9609" />
    </linearGradient>

    <!-- Drop Shadow for 3D Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Squircle Box (Centered: X=256, Y=256) -->
  <rect x="40" y="40" width="432" height="432" rx="96" ry="96" fill="url(#bgGrad)" stroke="#8ee61c" stroke-width="12" />

  <!-- 
    Exact 'T' Symbol Geometry:
    - Bounding Box: X [144 -> 368], Y [164 -> 348] (Exact Center: X=256, Y=256)
    - Top Bar: Smooth rounded upper-left corner, sharp parallel 45° angled right cut
    - Stem: 3D Origami fold (Left facet bright, Right facet shaded) meeting at X=256
  -->
  <g filter="url(#shadow)">
    <!-- Top Horizontal Bar -->
    <path d="M 172,164 
             C 152,164 144,174 144,212 
             L 278,212 
             L 368,164 
             Z" fill="url(#topBarGrad)" />

    <!-- Stem - Left Facet (Brighter Front Face) -->
    <path d="M 223,212 
             L 256,194 
             L 256,348 
             L 223,348 
             Z" fill="url(#stemLeft)" />

    <!-- Stem - Right Facet (Darker Angle/Fold Face) -->
    <path d="M 256,194 
             L 270,202 
             L 270,300 
             L 256,348 
             Z" fill="url(#stemRight)" />
  </g>
</svg>